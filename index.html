<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ScreenTime Guard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin:0;
    background:
      radial-gradient(circle at 15% -10%, rgba(79,191,166,0.16), transparent 45%),
      radial-gradient(circle at 100% 10%, rgba(232,163,61,0.10), transparent 40%),
      #0F1116;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .display { font-family: 'Space Grotesk', 'Inter', sans-serif; }
  input[type="range"] { -webkit-appearance: none; height: 4px; border-radius: 2px; background: #2A2F3D; }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: #4FBFA6; cursor: pointer; box-shadow: 0 0 0 4px rgba(79,191,166,0.18);
  }
  @keyframes riseIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
  @keyframes pulseGlow { 0%,100% { opacity:1; } 50% { opacity:0.55; } }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .rise { animation: riseIn 0.45s cubic-bezier(.16,1,.3,1) both; }
  .sheet-anim { animation: sheetUp 0.32s cubic-bezier(.16,1,.3,1) both; }
  .pulse-dot { animation: pulseGlow 1.6s ease-in-out infinite; }
  .card-hover { transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease; }
  .card-hover:active { transform: scale(0.985); }
  ::-webkit-scrollbar { width: 0px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

// ---- hand-rolled outline icon set (lucide-style paths, no external dep) ----
const ICON_PATHS = {
  instagram: "M7.5 3h9A4.5 4.5 0 0 1 21 7.5v9a4.5 4.5 0 0 1-4.5 4.5h-9A4.5 4.5 0 0 1 3 16.5v-9A4.5 4.5 0 0 1 7.5 3Z|M16.5 7.5h.01|M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z",
  youtube: "M22 12s0-3.4-.43-5a2.78 2.78 0 0 0-1.96-2C17.9 4.5 12 4.5 12 4.5s-5.9 0-7.61.5a2.78 2.78 0 0 0-1.96 2C2 8.6 2 12 2 12s0 3.4.43 5a2.78 2.78 0 0 0 1.96 2c1.71.5 7.61.5 7.61.5s5.9 0 7.61-.5a2.78 2.78 0 0 0 1.96-2c.43-1.6.43-5 .43-5Z|M10 9.5l5 2.5-5 2.5v-5Z",
  chat: "M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z",
  game: "M6 12h4m-2-2v4|M15 13h.01|M18 11h.01|M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.05-.01.1-.017.15L2 14.5A2.5 2.5 0 0 0 6.5 16.5L8 15h8l1.5 1.5a2.5 2.5 0 0 0 4.5-2l-.685-5.76a1 1 0 0 0-.017-.15A4 4 0 0 0 17.32 5Z",
  music: "M9 18V5l12-2v13|M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z|M21 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z",
  shop: "M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z|M3 6h18|M16 10a4 4 0 0 1-8 0",
  camera: "M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z|M12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z",
  mail: "M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z|M22 6.5l-10 7-10-7",
};
const CONTROL_PATHS = {
  plus: "M12 5v14|M5 12h14",
  x: "M18 6 6 18|M6 6l12 12",
  play: "M6 4l14 8-14 8V4Z",
  pause: "M7 4h3v16H7z|M14 4h3v16h-3z",
  reset: "M3 12a9 9 0 1 0 3-6.7|M3 4v5h5",
  warn: "M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L14.71 3.86a2 2 0 0 0-3.42 0Z|M12 9v4|M12 17h.01",
};

function Icon({ name, size = 18, color, strokeWidth = 2 }) {
  const d = ICON_PATHS[name] || CONTROL_PATHS[name];
  if (!d) return null;
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color || "currentColor"}
      strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">
      {d.split("|").map((seg, i) => <path key={i} d={seg} />)}
    </svg>
  );
}

const APP_ACCENTS = {
  instagram: "#E1306C", youtube: "#E2584A", chat: "#4FBFA6",
  game: "#8B7EE8", music: "#E8A33D", shop: "#5FA8E0", camera: "#4FBFA6", mail: "#868C9E",
};

const ICON_LIST = ["instagram", "youtube", "chat", "game", "music", "shop", "camera", "mail"];

const DEFAULT_APPS = [
  { id: "a1", name: "Instagram", icon: "instagram", limitMin: 45, usedSec: 22 * 60 },
  { id: "a2", name: "YouTube", icon: "youtube", limitMin: 60, usedSec: 38 * 60 },
  { id: "a3", name: "Messages", icon: "chat", limitMin: 30, usedSec: 9 * 60 },
];

function fmt(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  const h = Math.floor(m / 60);
  const mm = m % 60;
  if (h > 0) return `${h}h ${mm}m`;
  if (m > 0) return `${m}m ${s.toString().padStart(2, "0")}s`;
  return `${s}s`;
}

function statusOf(usedSec, limitMin) {
  const pct = usedSec / (limitMin * 60);
  if (pct >= 1) return "over";
  if (pct >= 0.8) return "warn";
  return "good";
}

const STATUS_COLOR = { good: "#4FBFA6", warn: "#E8A33D", over: "#E2584A" };
const STATUS_LABEL = { good: "On track", warn: "Almost there", over: "Over limit" };

function Ring({ pct, color, size = 56, stroke = 5 }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const clamped = Math.min(pct, 1);
  return (
    <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="#232838" strokeWidth={stroke} />
      <circle
        cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth={stroke}
        strokeDasharray={c} strokeDashoffset={c - clamped * c} strokeLinecap="round"
        style={{ transition: "stroke-dashoffset 0.6s cubic-bezier(.16,1,.3,1)" }}
      />
    </svg>
  );
}

function AddAppSheet({ onClose, onAdd }) {
  const [name, setName] = useState("");
  const [icon, setIcon] = useState("instagram");
  const [limit, setLimit] = useState(30);
  return (
    <div className="fixed inset-0 z-30 flex items-end justify-center">
      <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" onClick={onClose} />
      <div className="sheet-anim relative w-full max-w-sm rounded-t-3xl p-5 pb-7"
        style={{ background: "#171B24", borderTop: "1px solid #2A2F3D" }}>
        <div className="mx-auto mb-4 h-1 w-10 rounded-full" style={{ background: "#2A2F3D" }} />
        <div className="mb-5 flex items-center justify-between">
          <h2 className="text-lg font-semibold display" style={{ color: "#F1F2F6" }}>Track a new app</h2>
          <button onClick={onClose} style={{ color: "#868C9E" }}><Icon name="x" size={20} /></button>
        </div>
        <label className="block text-[11px] mb-1.5 font-semibold tracking-wider" style={{ color: "#6B7185" }}>APP NAME</label>
        <input value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. TikTok"
          className="w-full mb-4 rounded-xl px-3.5 py-2.5 text-sm outline-none"
          style={{ background: "#1E2330", color: "#F1F2F6", border: "1px solid #2A2F3D" }} />
        <label className="block text-[11px] mb-1.5 font-semibold tracking-wider" style={{ color: "#6B7185" }}>ICON</label>
        <div className="flex gap-2 mb-4 flex-wrap">
          {ICON_LIST.map((k) => {
            const active = icon === k;
            const accent = APP_ACCENTS[k];
            return (
              <button key={k} onClick={() => setIcon(k)} className="p-2.5 rounded-xl transition-all"
                style={{ background: active ? accent + "22" : "#1E2330", border: "1px solid " + (active ? accent : "#2A2F3D") }}>
                <Icon name={k} size={18} color={active ? accent : "#868C9E"} />
              </button>
            );
          })}
        </div>
        <label className="block text-[11px] mb-1.5 font-semibold tracking-wider" style={{ color: "#6B7185" }}>
          DAILY LIMIT — <span style={{ color: "#4FBFA6" }}>{limit} min</span>
        </label>
        <input type="range" min="5" max="180" step="5" value={limit} onChange={(e) => setLimit(Number(e.target.value))} className="w-full mb-6" />
        <button disabled={!name.trim()} onClick={() => {
            if (!name.trim()) return;
            onAdd({ id: "a" + Date.now(), name: name.trim(), icon, limitMin: limit, usedSec: 0 });
            onClose();
          }}
          className="w-full rounded-xl py-3 text-sm font-semibold disabled:opacity-40 transition-transform active:scale-[0.98]"
          style={{ background: "linear-gradient(135deg, #4FBFA6, #3FA890)", color: "#0F1116" }}>
          Start tracking
        </button>
      </div>
    </div>
  );
}

function AppCard({ app, onRemove, onSimToggle, simActive, index }) {
  const pct = app.usedSec / (app.limitMin * 60);
  const status = statusOf(app.usedSec, app.limitMin);
  const color = STATUS_COLOR[status];
  const accent = APP_ACCENTS[app.icon] || "#4FBFA6";
  return (
    <div className="rise card-hover rounded-2xl p-4 flex items-center gap-3.5"
      style={{
        background: "#171B24",
        border: `1px solid ${status === "over" ? "#E2584A55" : "#232838"}`,
        animationDelay: `${index * 60}ms`,
      }}>
      <div className="relative flex items-center justify-center shrink-0" style={{ width: 56, height: 56 }}>
        <Ring pct={pct} color={color} />
        <div className="absolute inset-0 flex items-center justify-center rounded-full m-2"
          style={{ background: accent + "1A" }}>
          <Icon name={app.icon} size={18} color={accent} />
        </div>
      </div>
      <div className="flex-1 min-w-0">
        <div className="flex items-center justify-between gap-2">
          <span className="font-semibold text-sm truncate display" style={{ color: "#F1F2F6" }}>{app.name}</span>
          <button onClick={() => onRemove(app.id)} style={{ color: "#4A5065" }}><Icon name="x" size={13} /></button>
        </div>
        <div className="flex items-center gap-1.5 mt-1">
          <span className="text-xs" style={{ color: "#868C9E", fontFamily: "'Space Grotesk', monospace" }}>
            {fmt(app.usedSec)} <span style={{ color: "#4A5065" }}>/ {app.limitMin}m</span>
          </span>
          <span className="flex items-center gap-1 text-[10px] font-semibold px-1.5 py-0.5 rounded-full" style={{ background: color + "1F", color }}>
            {status !== "good" && <span className="w-1 h-1 rounded-full pulse-dot" style={{ background: color }} />}
            {STATUS_LABEL[status]}
          </span>
        </div>
      </div>
      <button onClick={() => onSimToggle(app.id)} className="p-2.5 rounded-full shrink-0 transition-all active:scale-90"
        style={{ background: simActive ? color + "22" : "#1E2330", color: simActive ? color : "#868C9E" }}
        title="Simulate usage (demo)">
        <Icon name={simActive ? "pause" : "play"} size={14} />
      </button>
    </div>
  );
}

function WarningToast({ app, status, onDismiss }) {
  const color = STATUS_COLOR[status];
  return (
    <div className="fixed inset-x-0 z-40 flex justify-center px-4 pointer-events-none"
      style={{ bottom: "calc(96px + env(safe-area-inset-bottom, 0px))" }}>
      <div className="rise pointer-events-auto w-full max-w-sm rounded-2xl px-4 py-3 flex items-center gap-3 shadow-2xl"
        style={{ background: "#171B24", border: `1px solid ${color}55`, boxShadow: `0 8px 30px ${color}22` }}>
        <div className="p-2 rounded-full shrink-0" style={{ background: color + "22", color }}><Icon name="warn" size={18} /></div>
        <div className="flex-1 min-w-0">
          <p className="text-sm font-semibold display" style={{ color: "#F1F2F6" }}>
            {status === "over" ? `${app.name} limit reached` : `Approaching ${app.name} limit`}
          </p>
          <p className="text-xs" style={{ color: "#868C9E" }}>{fmt(app.usedSec)} of {app.limitMin}m used today</p>
        </div>
        <button onClick={onDismiss} style={{ color: "#4A5065" }}><Icon name="x" size={16} /></button>
      </div>
    </div>
  );
}

function ScreenTimeGuard() {
  const [apps, setApps] = useState(() => {
    try {
      const saved = localStorage.getItem("screentime-apps");
      if (saved) return JSON.parse(saved);
    } catch (e) {}
    return DEFAULT_APPS;
  });
  const [showAdd, setShowAdd] = useState(false);
  const [simIds, setSimIds] = useState({});
  const [toast, setToast] = useState(null);
  const [notified, setNotified] = useState({});

  useEffect(() => {
    try { localStorage.setItem("screentime-apps", JSON.stringify(apps)); } catch (e) {}
  }, [apps]);

  useEffect(() => {
    const interval = setInterval(() => {
      setApps((prev) => prev.map((a) => (simIds[a.id] ? { ...a, usedSec: a.usedSec + 20 } : a)));
    }, 1000);
    return () => clearInterval(interval);
  }, [simIds]);

  useEffect(() => {
    for (const app of apps) {
      const status = statusOf(app.usedSec, app.limitMin);
      if ((status === "warn" || status === "over") && notified[app.id] !== status) {
        setToast({ app, status });
        setNotified((n) => ({ ...n, [app.id]: status }));
        break;
      }
    }
  }, [apps]);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 4500);
    return () => clearTimeout(t);
  }, [toast]);

  const addApp = useCallback((app) => setApps((p) => [...p, app]), []);
  const removeApp = useCallback((id) => {
    setApps((p) => p.filter((a) => a.id !== id));
    setSimIds((s) => { const c = { ...s }; delete c[id]; return c; });
  }, []);
  const toggleSim = useCallback((id) => setSimIds((s) => ({ ...s, [id]: !s[id] })), []);
  const resetDay = useCallback(() => {
    setApps((p) => p.map((a) => ({ ...a, usedSec: 0 })));
    setNotified({});
    setSimIds({});
  }, []);

  const totalUsed = apps.reduce((s, a) => s + a.usedSec, 0);
  const totalLimit = apps.reduce((s, a) => s + a.limitMin * 60, 0);
  const overCount = apps.filter((a) => statusOf(a.usedSec, a.limitMin) === "over").length;
  const overallColor = overCount > 0 ? "#E2584A" : (totalLimit && totalUsed / totalLimit >= 0.8 ? "#E8A33D" : "#4FBFA6");

  return (
    <div className="min-h-screen w-full flex justify-center">
      <div className="w-full max-w-sm relative pb-28">
        {toast && <WarningToast app={toast.app} status={toast.status} onDismiss={() => setToast(null)} />}

        <div className="px-5 pt-8 pb-4 rise">
          <div className="flex items-center gap-1.5 mb-1">
            <span className="w-1.5 h-1.5 rounded-full" style={{ background: "#4FBFA6" }} />
            <p className="text-[11px] font-semibold tracking-[0.15em]" style={{ color: "#6B7185" }}>TODAY'S SCREEN TIME</p>
          </div>
          <div className="flex items-end justify-between mt-1">
            <h1 className="text-4xl font-bold display" style={{ color: "#F1F2F6", letterSpacing: "-0.02em" }}>{fmt(totalUsed)}</h1>
            <button onClick={resetDay} className="flex items-center gap-1 text-xs pb-1.5 transition-opacity active:opacity-60" style={{ color: "#6B7185" }}>
              <Icon name="reset" size={12} /> Reset
            </button>
          </div>
          <p className="text-xs mt-1.5" style={{ color: "#6B7185" }}>
            {fmt(totalLimit)} budgeted across {apps.length} app{apps.length !== 1 ? "s" : ""}
            {overCount > 0 && <span style={{ color: "#E2584A" }}> · {overCount} over limit</span>}
          </p>
        </div>

        <div className="px-5 mb-5 rise" style={{ animationDelay: "80ms" }}>
          <div className="rounded-2xl p-5 flex items-center gap-4" style={{
            background: "linear-gradient(155deg, #171B24, #14171F)",
            border: "1px solid #232838",
          }}>
            <div className="relative flex items-center justify-center shrink-0" style={{ width: 72, height: 72 }}>
              <Ring size={72} stroke={6} pct={totalLimit ? totalUsed / totalLimit : 0} color={overallColor} />
              <div className="absolute inset-0 flex items-center justify-center text-sm font-bold display" style={{ color: "#F1F2F6" }}>
                {totalLimit ? Math.min(100, Math.round((totalUsed / totalLimit) * 100)) : 0}%
              </div>
            </div>
            <div>
              <p className="text-sm font-semibold display" style={{ color: "#F1F2F6" }}>Daily budget</p>
              <p className="text-xs mt-0.5 leading-relaxed" style={{ color: "#868C9E" }}>
                Tap <Icon name="play" size={10} color="#868C9E" strokeWidth={2.5} /> on any app to simulate live usage and preview the warning.
              </p>
            </div>
          </div>
        </div>

        <div className="px-5 flex flex-col gap-2.5">
          {apps.map((app, i) => (
            <AppCard key={app.id} index={i} app={app} onRemove={removeApp} onSimToggle={toggleSim} simActive={!!simIds[app.id]} />
          ))}
          {apps.length === 0 && (
            <div className="rounded-2xl p-6 text-center" style={{ background: "#171B24", border: "1px dashed #2A2F3D" }}>
              <p className="text-sm" style={{ color: "#868C9E" }}>No apps tracked yet. Add one to get started.</p>
            </div>
          )}
        </div>

        <button onClick={() => setShowAdd(true)}
          className="fixed bottom-7 left-1/2 -translate-x-1/2 flex items-center gap-2 rounded-full px-5 py-3 text-sm font-semibold shadow-2xl transition-transform active:scale-95"
          style={{ background: "linear-gradient(135deg, #4FBFA6, #3FA890)", color: "#0F1116", boxShadow: "0 8px 24px rgba(79,191,166,0.35)" }}>
          <Icon name="plus" size={16} strokeWidth={2.5} /> Add app
        </button>

        {showAdd && <AddAppSheet onClose={() => setShowAdd(false)} onAdd={addApp} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ScreenTimeGuard />);
</script>
</body>
</html>
